# .air.toml

root = "."
tmp_dir = "tmp"

[build]
  # Build command — points to your entry point
  cmd = "go build -o ./tmp/main ./cmd/main.go"
  # Binary produced by the build command above
  bin = "./tmp/main"
  # Extra arguments passed to the binary when it runs (leave empty unless your app needs flags)
  args_bin = []

  # Watch these file extensions for changes
  include_ext = ["go", "tpl", "tmpl", "html", "env"]

  # Directories to exclude from watching (build artifacts, deps, tests, git)
  exclude_dir = ["tmp", "vendor", "node_modules", ".git", "docs"]

  # Exclude test files from triggering rebuilds
  exclude_regex = ["_test\\.go"]

  # Also watch these specific files even if their dir isn't included
  include_file = []

  # Don't rebuild on file deletion events (only create/write)
  exclude_unchanged = true
  follow_symlink = false

  # Log file for build errors, kept inside tmp_dir
  log = "air_build_errors.log"

  # Delay before triggering rebuild after a file change (debounce rapid saves)
  delay = 1000 # ms

  # Stop running old binary before building new one (prevents port-already-in-use errors)
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500 # ms

  # Rerun binary even if build fails to produce a new binary (keep last known good running)
  rerun = false

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[log]
  time   = true
  # Only show main logs, silence Air's own noisy internal logs
  main_only = false

[misc]
  # Delete tmp dir on exit (keeps repo clean)
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true